<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عين الشعب - منصة متابعة المشاريع الحكومية</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; }
    header { padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: #38bdf8; }
    #container { display: flex; flex-direction: column; height: calc(100vh - 65px); }
    #map { flex: 1; width: 100%; height: 50vh; }
    #projects-list { padding: 1.5rem; background: #0f172a; overflow-y: auto; flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .card { background: #1e293b; padding: 1.25rem; border-radius: 12px; border: 1px solid #334155; }
    .card h3 { color: #f1f5f9; margin-bottom: 0.5rem; }
    .card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .badge { display: inline-block; padding: 0.25rem 0.5rem; font-size: 0.8rem; border-radius: 6px; background: #0284c7; color: white; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <header>
    <h1>عين الشعب 🇮🇶</h1>
    <span>منصة تعقب المشاريع والموازنات</span>
  </header>

  <div id="container">
    <div id="map"></div>
    <div id="projects-list"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // إعداد الخريطة على مدينة الناصرية
    const map = L.map('map').setView([31.058, 46.257], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // بيانات المشروع التجريبي مباشرة
    const projects = [
      {
        title: "مستشفى الناصرية المركزي",
        entity: "دائرة صحة ذي قار",
        governorate: "ذي قار",
        district: "الناصرية",
        budget: "45 مليار دينار",
        completion_rate: 65,
        status: "قيد التنفيذ",
        lat: 31.058,
        lng: 46.257
      }
    ];

    const listContainer = document.getElementById('projects-list');

    projects.forEach(project => {
      // إضافة المؤشر على الخريطة
      const marker = L.marker([project.lat, project.lng]).addTo(map);
      marker.bindPopup(`<b>${project.title}</b><br>نسبة الإنجاز: ${project.completion_rate}%`).openPopup();

      // إضافة البطاقة في الأسفل
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${project.title}</h3>
        <p><strong>الجهة:</strong> ${project.entity}</p>
        <p><strong>المحافظة:</strong> ${project.governorate} - ${project.district}</p>
        <p><strong>الموازنة:</strong> ${project.budget}</p>
        <p><strong>نسبة الإنجاز:</strong> ${project.completion_rate}%</p>
        <span class="badge">${project.status}</span>
      `;
      listContainer.appendChild(card);
    });
  </script>
</body>
</html>
